version: "3.8"
services:
  db:
    container_name: postgres_container
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  #pgadmin:
  #  container_name: pgadmin4_container
  #  image: dpage/pgadmin4
  #  restart: always
  #  environment:
  #    PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #    PGADMIN_DEFAULT_PASSWORD: aloha123
  #  ports:
  #    - "5050:80"

  flask:
    container_name: flask_container
    build: ./flask
    volumes:
      - ./flask:/usr/src/flask
    ports:
      - 5001:5000
    depends_on:
      - db
    command: python3 /usr/src/flask/app.py

  vue:
    container_name: vue_container
    build: ./testApp
    volumes:
      - ./testApp:/home/node/app
    depends_on:
      - flask
    ports:
      - 8080:8080

volumes:
  postgres_data: